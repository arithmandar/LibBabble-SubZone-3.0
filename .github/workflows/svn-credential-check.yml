name: SVN credential check

# Checks that SVN_USERNAME and SVN_PASSWORD can authenticate for SVN writes,
# without creating any revision.
#
# It opens an SVN commit transaction (the first step of every svn commit) and
# deletes it right away. A transaction that is never committed leaves no
# revision, no log entry, and no file changes.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: svn-mirror
    steps:
      - name: Check credentials
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          REPO_URL: https://repos.wowace.com/wow/libbabble-subzone-3-0
        run: |
          set -euo pipefail
          if [ -z "$SVN_USERNAME" ] || [ -z "$SVN_PASSWORD" ]; then
            echo "::error::SVN_USERNAME or SVN_PASSWORD is not set in the svn-mirror environment."
            exit 1
          fi

          # Pass credentials through a curl config on stdin, not the command line.
          auth() { printf 'user = "%s:%s"\n' "$SVN_USERNAME" "$SVN_PASSWORD"; }

          headers="$(mktemp)"
          status="$(auth | curl -sS -K - -o /dev/null -D "$headers" -w '%{http_code}' \
            -X POST -H 'Content-Type: application/vnd.svn-skel' \
            --data-binary '( create-txn )' "$REPO_URL/!svn/me")"

          txn="$(sed -n 's/^[Ss][Vv][Nn]-[Tt]xn-[Nn]ame: *\([^[:space:]]*\).*/\1/p' "$headers" | head -n1)"
          if [ -n "$txn" ]; then
            del="$(auth | curl -sS -K - -o /dev/null -w '%{http_code}' -X DELETE "$REPO_URL/!svn/txn/$txn")"
            echo "Deleted test transaction $txn (HTTP $del)."
          fi

          case "$status" in
            201)
              echo "### SVN credentials OK" >>"$GITHUB_STEP_SUMMARY"
              echo "Write authentication succeeded (HTTP 201). No revision was created." | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            401)
              echo "### SVN credentials rejected" >>"$GITHUB_STEP_SUMMARY"
              echo "::error::HTTP 401: the server rejected SVN_USERNAME / SVN_PASSWORD."
              exit 1
              ;;
            403)
              echo "### SVN credentials accepted, but no write access" >>"$GITHUB_STEP_SUMMARY"
              echo "::error::HTTP 403: authenticated, but this account cannot write to the repository."
              exit 1
              ;;
            *)
              echo "::error::Unexpected HTTP $status from the SVN server."
              exit 1
              ;;
          esac
