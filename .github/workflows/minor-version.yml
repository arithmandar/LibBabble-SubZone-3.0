name: MINOR_VERSION check

# Fails when a pull request changes files loaded in game (Core, Data, Locale,
# lib.xml) without increasing MINOR_VERSION in Core/Core.lua.

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check MINOR_VERSION
        run: >
          python3 .github/scripts/check_minor_version.py
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"
